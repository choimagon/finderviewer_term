[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "finderview-terminal"
version = "0.1.0"
description = "터미널에서 사용하는 Finder 스타일 열 보기 파일 탐색기"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "JiHun Choi"}]
dependencies = ["textual>=8.2.8,<9", "send2trash>=1.8,<3"]

[project.urls]
Homepage = "https://github.com/choimagon/finderviewer_term"
Repository = "https://github.com/choimagon/finderviewer_term"
Issues = "https://github.com/choimagon/finderviewer_term/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
finderviewer = "finderview_tui.__main__:main"
finderview = "finderview_tui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
